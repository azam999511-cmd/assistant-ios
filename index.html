<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعدي</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#dff0ff,#bcd9ff);font-family:system-ui,sans-serif;color:#123}
.b{width:min(92vw,420px);background:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 40px #0a2a6a22;display:flex;flex-direction:column;gap:12px;text-align:center}
img{width:72px;height:72px;margin:auto;border-radius:20px}
input,button{font:inherit;font-size:16px;padding:13px;border-radius:14px;border:1px solid #9bb}
button{background:#2f8cff;color:#fff;border:0}button.g{background:#eef4ff;color:#235}
p{margin:0;font-size:.9rem;line-height:1.7;color:#456}.e{color:#b3261e}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f1f6ff;border-radius:12px;padding:8px 12px;font-size:.85rem;direction:ltr}
li b{font-weight:600;color:#235;overflow:hidden;text-overflow:ellipsis}
li button{background:none;color:#b3261e;padding:2px 8px;font-size:18px;border:0}
</style></head><body><div class="b">
<img src="icon.png" alt="">
<h2 style="margin:0">مساعدي</h2>
<p id="m">الصق رابط الربط من البيسي (الإعدادات ← ربط الجوال).</p>
<ul id="l"></ul>
<input id="u" dir="ltr" placeholder="https://اسم-جهازك.ts.net/?t=..." autocapitalize="off" autocorrect="off">
<button class="g" id="add">إضافة الرابط</button>
<button id="go">اتصل</button>
<p style="font-size:.78rem">تقدر تضيف أكثر من رابط (واي فاي البيت + Tailscale). يجرّبهم كلهم ويفتح أول واحد يشتغل، فيشتغل من أي مكان.</p>
</div>
<script>
const $=i=>document.getElementById(i);
let urls=[];try{urls=JSON.parse(localStorage.getItem('musaedi.urls')||'[]')}catch{}
try{const o=localStorage.getItem('musaedi.url');if(o&&!urls.includes(o))urls.unshift(o)}catch{}
const save=()=>{try{localStorage.setItem('musaedi.urls',JSON.stringify(urls))}catch{}};
const host=u=>{try{return new URL(u).host}catch{return u}};
function draw(){const l=$('l');l.innerHTML='';urls.forEach((u,i)=>{const li=document.createElement('li');li.innerHTML='<b></b><button aria-label="حذف">×</button>';li.querySelector('b').textContent=host(u);li.querySelector('button').onclick=()=>{urls.splice(i,1);save();draw()};l.append(li)});$('go').textContent=urls.length?'اتصل':'اتصل'}
function msg(t,err){$('m').textContent=t;$('m').className=err?'e':''}
function reach(u){return new Promise((ok,no)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);fetch(u,{mode:'no-cors',signal:c.signal}).then(()=>{clearTimeout(t);ok(u)}).catch(e=>{clearTimeout(t);no(e)})})}
async function connect(){
 if(!urls.length){msg('أضف رابط الربط أول.',true);return}
 msg('جاري الاتصال بالبيسي…');$('go').disabled=true;
 try{const u=await Promise.any(urls.map(reach));try{localStorage.setItem('musaedi.last',u)}catch{};location.replace(u)}
 catch{msg('ما قدرت أوصل للبيسي. تأكد إنه شغّال وإن «ربط الجوال» مفعّل، ولو أنت برا البيت لازم Tailscale شغّال على الجوال.',true);$('go').disabled=false;$('go').textContent='أعد المحاولة'}
}
$('add').onclick=()=>{const v=$('u').value.trim();if(!/^https?:\/\//i.test(v)){msg('الرابط لازم يبدأ بـ http أو https',true);return}
 if(!urls.includes(v))urls.push(v);save();draw();$('u').value='';msg('انضاف. تقدر تضيف رابط ثاني أو تضغط اتصل.')};
$('go').onclick=()=>{const v=$('u').value.trim();if(/^https?:\/\//i.test(v)&&!urls.includes(v)){urls.push(v);save();draw();$('u').value=''}connect()};
draw();if(urls.length)connect();
</script></body></html>
