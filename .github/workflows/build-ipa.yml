name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build iOS Project
        run: |
          # 1. إنشاء ملف package.json و capacitor.config.json مباشر بدون أوامر معقدة
          echo '{"name": "assistant-app", "version": "1.0.0", "private": true, "dependencies": {"@capacitor/core": "^6.0.0", "@capacitor/ios": "^6.0.0"}}' > package.json
          
          echo '{"appId": "com.azzam.assistant", "appName": "Assistant", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

          # 2. تنظيم مجلد الويب
          mkdir -p www
          find . -maxdepth 1 ! -name 'www' ! -name 'ios' ! -name '.' ! -name '..' -exec mv {} www/ \;

          # 3. تثبيت الحزم وإضافة منصة آي أو إس
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Assistant.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Assistant-IPA
          path: ios/App/Assistant.ipa
