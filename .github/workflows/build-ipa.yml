name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build iOS App Bundle
        run: |
          # 1. تثبيت أدوات كاباسيتور مباشرة وبدون تداخل
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          # 2. إنشاء إعدادات المشروع الأساسية
          npx cap init "Assistant" "com.azzam.assistant" --web-dir www --bundled-web-runtime false || true

          # 3. تنظيم مجلد الويب للملفات
          mkdir -p www
          find . -maxdepth 1 ! -name 'www' ! -name 'ios' ! -name '.' ! -name '..' -exec mv {} www/ \;

          # 4. مزامنة منصة الآيفون
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Assistant.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Assistant-IPA
          path: ios/App/Assistant.ipa
