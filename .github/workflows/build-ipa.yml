name: Build iOS IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # يستخدم مجلد mobile اللي فيه الإعدادات الصحيحة (يفتح خادم البيسي داخل التطبيق بدل سفاري)
      - name: Capacitor
        working-directory: mobile
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Info.plist (http + mic)
        working-directory: mobile/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string للتحدث مع المساعد" Info.plist || true

      - name: Build (بدون توقيع)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr musaedi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Assistant-IPA
          path: mobile/ios/App/musaedi.ipa
