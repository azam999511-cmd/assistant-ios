<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعدي</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#dff0ff,#bcd9ff);font-family:system-ui,sans-serif;color:#123}
.b{width:min(92vw,420px);background:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 40px #0a2a6a22;display:flex;flex-direction:column;gap:12px;text-align:center}
img{width:72px;height:72px;margin:auto;border-radius:20px}
input,button{font:inherit;font-size:16px;padding:13px;border-radius:14px;border:1px solid #9bb}
button{background:#2f8cff;color:#fff;border:0}button.g{background:#eef4ff;color:#235}
p{margin:0;font-size:.9rem;line-height:1.7;color:#456}.e{color:#b3261e}
</style></head><body><div class="b">
<img src="icon.png" alt="">
<h2 style="margin:0">مساعدي</h2>
<p id="m">الصق رابط الربط من البيسي (الإعدادات ← ربط الجوال).</p>
<input id="u" dir="ltr" placeholder="https://اسم-جهازك.ts.net/?t=..." autocapitalize="off" autocorrect="off">
<button id="go">اتصل</button>
<button class="g" id="ch" hidden>غيّر الرابط</button>
</div>
<script>
const $=i=>document.getElementById(i);let url='';try{url=localStorage.getItem('musaedi.url')||''}catch{}
async function ok(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);try{await fetch(u,{mode:'no-cors',signal:c.signal});return true}catch{return false}finally{clearTimeout(t)}}
async function open_(u){$('m').textContent='جاري الاتصال بالبيسي…';$('m').className='';
 if(await ok(u)){try{localStorage.setItem('musaedi.url',u)}catch{};location.replace(u)}
 else{$('m').textContent='ما قدرت أوصل للبيسي. تأكد إنه شغّال وإن Tailscale أو الواي فاي شغّال، وإن «ربط الجوال» مفعّل.';$('m').className='e';$('u').value=u;$('go').textContent='أعد المحاولة';$('ch').hidden=false}}
$('go').onclick=()=>{const v=$('u').value.trim();if(/^https?:\/\//i.test(v))open_(v);else{$('m').textContent='الرابط لازم يبدأ بـ http أو https';$('m').className='e'}};
$('ch').onclick=()=>{try{localStorage.removeItem('musaedi.url')}catch{};$('u').value='';$('ch').hidden=true;$('m').textContent='الصق الرابط الجديد.'};
if(url){$('u').value=url;open_(url)}
</script></body></html>
